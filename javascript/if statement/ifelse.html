
<html>
<head>
  
    <title>IF...ELSE IF...ELSE</title>
</head>
<body>
    <script>
        var num=5;
        if(num>0)
        {
            document.write("Number is positive");
        }
        else if(num<0)
        {
            document.write("Number is negative");
        }
        else
        {
            document.write("number is zero");
        }
    </script>
</body>
</html>
